<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" width="1040" height="430" role="img" aria-label="Step 1: your agent finishes a task and says the tests pass. Step 2: Shipward runs the test command you declared. Step 3: if it passes the card moves to Review with the proof attached; if it fails the card stays in progress and the error is written on it.">
  <style>
    .step { font: 800 12px "Archivo", system-ui, sans-serif; letter-spacing: 0.14em; }
    .ttl  { font: 800 19px "Archivo", system-ui, sans-serif; letter-spacing: -0.01em; }
    .b    { font: 400 14.5px system-ui, sans-serif; }
    .card { font: 700 14px system-ui, sans-serif; }
    .meta { font: 600 12px ui-monospace, Menlo, monospace; }
    .quo  { font: italic 400 15px Georgia, serif; }
  </style>
  <rect width="1040" height="430" fill="#f3f2f2"/>

  <!-- ─── STEP 1 ─────────────────────────────────────────── -->
  <text x="24" y="34" class="step" fill="#605d5d">STEP 1</text>
  <text x="24" y="60" class="ttl" fill="#201e1d">Your agent finishes</text>

  <!-- a card, drawn like the real desk: sharp corners, left accent -->
  <rect x="24" y="80" width="256" height="86" fill="#eae9e9" stroke="#bab6b6"/>
  <rect x="24" y="80" width="4" height="86" fill="#ec3013"/>
  <text x="42" y="104" class="meta" fill="#ae1800">SW-042</text>
  <text x="42" y="128" class="card" fill="#201e1d">Fix the login bug</text>
  <text x="42" y="152" class="meta" fill="#605d5d">in progress</text>

  <!-- speech bubble -->
  <path d="M24 186 h256 v58 h-232 l-14 18 v-18 h-10 z" fill="#ffffff" stroke="#201e1d" stroke-width="1.5"/>
  <text x="42" y="212" class="quo" fill="#201e1d">“Done — tests pass.”</text>
  <text x="42" y="232" class="b" fill="#605d5d">Every board believes this.</text>

  <path d="M292 168 h48" stroke="#201e1d" stroke-width="2.5"/>
  <path d="M334 161 l9 7 -9 7 z" fill="#201e1d"/>

  <!-- ─── STEP 2 ─────────────────────────────────────────── -->
  <text x="356" y="34" class="step" fill="#ae1800">STEP 2</text>
  <text x="356" y="60" class="ttl" fill="#201e1d">Shipward checks</text>

  <rect x="356" y="80" width="252" height="164" fill="#ffffff" stroke="#201e1d" stroke-width="2.5"/>
  <text x="376" y="108" class="b" fill="#605d5d">It runs the command</text>
  <text x="376" y="128" class="b" fill="#605d5d">you declared once:</text>
  <rect x="376" y="142" width="150" height="32" fill="#201e1d"/>
  <text x="390" y="163" class="meta" fill="#f3f2f2">npm test</text>
  <text x="376" y="198" class="b" fill="#605d5d">Right now — not later,</text>
  <text x="376" y="218" class="b" fill="#605d5d">not in CI, not by hand.</text>

  <path d="M620 168 h34 v-72 h36" fill="none" stroke="#1a7f43" stroke-width="2.5"/>
  <path d="M684 89 l9 7 -9 7 z" fill="#1a7f43"/>
  <path d="M620 168 h34 v96 h36" fill="none" stroke="#b3341a" stroke-width="2.5"/>
  <path d="M684 257 l9 7 -9 7 z" fill="#b3341a"/>

  <!-- ─── STEP 3 ─────────────────────────────────────────── -->
  <text x="704" y="34" class="step" fill="#605d5d">STEP 3</text>
  <text x="704" y="60" class="ttl" fill="#201e1d">One of two things</text>

  <!-- passes -->
  <rect x="704" y="76" width="312" height="106" fill="#dcf3e4" stroke="#1a7f43" stroke-width="2"/>
  <rect x="704" y="76" width="4" height="106" fill="#1a7f43"/>
  <path d="M726 118 l8 9 16 -19" fill="none" stroke="#1a7f43" stroke-width="3.5" stroke-linecap="round"/>
  <text x="762" y="106" class="card" fill="#0b2e1a">It passed</text>
  <text x="762" y="130" class="b" fill="#12602f">The card moves to Review,</text>
  <text x="762" y="150" class="b" fill="#12602f">with the proof kept on it:</text>
  <text x="762" y="170" class="meta" fill="#12602f">verified at 4871a63</text>

  <!-- fails -->
  <rect x="704" y="212" width="312" height="126" fill="#fde3dd" stroke="#b3341a" stroke-width="2"/>
  <rect x="704" y="212" width="4" height="126" fill="#b3341a"/>
  <path d="M726 248 l18 18 M744 248 l-18 18" stroke="#b3341a" stroke-width="3.5" stroke-linecap="round"/>
  <text x="762" y="242" class="card" fill="#3d0f06">It failed</text>
  <text x="762" y="266" class="b" fill="#8c2a15">The card does NOT move.</text>
  <text x="762" y="286" class="b" fill="#8c2a15">The error is written on it,</text>
  <text x="762" y="306" class="b" fill="#8c2a15">where you and the agent</text>
  <text x="762" y="326" class="b" fill="#8c2a15">will both read it next time.</text>

  <!-- footer -->
  <path d="M24 372 h992" stroke="#bab6b6" stroke-width="1"/>
  <text x="24" y="400" class="b" fill="#605d5d">You set the command once, per project. After that nobody has to remember to check — not you, and not the agent.</text>
</svg>
