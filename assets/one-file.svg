<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" role="img" aria-label="You, Claude Code and any other agent all read and write two plain files inside your own repo. Git checks those files against what actually happened.">
  <style>
    .h   { font: 800 15px "Archivo", system-ui, sans-serif; letter-spacing: -0.01em; }
    .b   { font: 400 13px system-ui, sans-serif; }
    .m   { font: 600 12px ui-monospace, Menlo, monospace; }
    .lbl { font: 800 10px "Archivo", system-ui, sans-serif; letter-spacing: 0.11em; }
  </style>

  <!-- three writers -->
  <g>
    <rect x="20" y="24" width="196" height="62" fill="#eae9e9" stroke="#bab6b6"/>
    <text x="38" y="48" class="lbl" fill="#605d5d">YOU</text>
    <text x="38" y="70" class="h" fill="#201e1d">the board in your browser</text>
  </g>
  <g>
    <rect x="20" y="99" width="196" height="62" fill="#eae9e9" stroke="#bab6b6"/>
    <text x="38" y="123" class="lbl" fill="#605d5d">CLAUDE CODE</text>
    <text x="38" y="145" class="h" fill="#201e1d">six tools, over MCP</text>
  </g>
  <g>
    <rect x="20" y="174" width="196" height="62" fill="#eae9e9" stroke="#bab6b6"/>
    <text x="38" y="198" class="lbl" fill="#605d5d">ANY OTHER AGENT</text>
    <text x="38" y="220" class="h" fill="#201e1d">the same six, as commands</text>
  </g>

  <path d="M222 55 L300 55 L300 118" fill="none" stroke="#605d5d" stroke-width="1.5"/>
  <path d="M222 130 L300 130" fill="none" stroke="#605d5d" stroke-width="1.5"/>
  <path d="M222 205 L300 205 L300 142" fill="none" stroke="#605d5d" stroke-width="1.5"/>
  <path d="M296 124 L304 130 L296 136 Z" fill="#605d5d"/>

  <!-- the two files -->
  <rect x="312" y="60" width="248" height="140" fill="#ffffff" stroke="#201e1d" stroke-width="2"/>
  <text x="332" y="88" class="lbl" fill="#ae1800">TWO PLAIN FILES, IN YOUR REPO</text>
  <rect x="332" y="102" width="208" height="30" fill="#201e1d"/>
  <text x="344" y="122" class="m" fill="#f3f2f2">.shipward/tracker.json</text>
  <rect x="332" y="138" width="208" height="30" fill="#201e1d"/>
  <text x="344" y="158" class="m" fill="#f3f2f2">.shipward/notes.jsonl</text>
  <text x="332" y="188" class="b" fill="#605d5d">committed with your code · reviewable in a PR</text>

  <path d="M566 130 L644 130" fill="none" stroke="#ec3013" stroke-width="2"/>
  <path d="M638 124 L646 130 L638 136 Z" fill="#ec3013"/>

  <!-- git -->
  <rect x="652" y="60" width="208" height="140" fill="#fde3dd" stroke="#b3341a" stroke-width="2"/>
  <rect x="652" y="60" width="4" height="140" fill="#b3341a"/>
  <text x="674" y="88" class="lbl" fill="#8c2a15">GIT REFEREES</text>
  <text x="674" y="114" class="h" fill="#3d0f06">Reads what actually</text>
  <text x="674" y="134" class="h" fill="#3d0f06">happened, and fixes</text>
  <text x="674" y="154" class="h" fill="#3d0f06">the board unasked</text>
  <text x="674" y="180" class="b" fill="#8c2a15">only ever forwards, never over you</text>
</svg>
